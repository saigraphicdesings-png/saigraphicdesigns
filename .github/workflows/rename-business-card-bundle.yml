name: Inspect business card bundle title
on:
  push:
    branches: [fix/rename-business-card-bundle]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Find exact product record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.129.1 d1 execute sai-shop-products --remote --config wrangler.jsonc --command "SELECT id, name, price FROM products WHERE name = 'Business Card Bundle 1001'" --json
