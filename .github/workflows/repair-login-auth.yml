name: Repair login authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: repair login authentication'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair password verification
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/worker.js')
          text = path.read_text()
          start = text.index('async function login(request, env) {')
          end = text.index('\nasync function logout(request, env) {', start)

          replacement = r'''async function derivePasswordHashWebCrypto(password, saltBytes, iterations) {
  const key = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveBits"]
  );
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: saltBytes, iterations, hash: "SHA-256" },
    key,
    256
  );
  return bytesToBase64(new Uint8Array(bits));
}

async function login(request, env) {
  await ensureAccountSchema(env);

  let input;
  try {
    input = await request.json();
  } catch {
    return json({ error: "Invalid request." }, 400);
  }

  const email = normalizeEmail(input.email);
  const password = String(input.password || "");

  if (!email || !password) {
    return json({ error: "Invalid email or password." }, 401);
  }

  const customer = await env.DB.prepare(
    "SELECT * FROM customer_accounts WHERE email = ? AND active = 1 LIMIT 1"
  ).bind(email).first();

  if (!customer || !customer.password_hash || !customer.password_salt) {
    return json({ error: "Invalid email or password." }, 401);
  }

  const stored = String(customer.password_hash).trim();
  const salt = base64ToBytes(customer.password_salt);

  const versioned = /^pbkdf2-sha256\\$(\\d+)\\$([A-Za-z0-9+/]{43}=)$/.exec(stored);
  const malformedVersioned = /^pbkdf2-sha256(\\d+)([A-Za-z0-9+/]{43}=)$/.exec(stored);
  const unversioned = /^([A-Za-z0-9+/]{43}=)$/.exec(stored);

  if (!versioned && !malformedVersioned && !unversioned) {
    return json({ error: "Invalid email or password." }, 401);
  }

  const iterations = versioned
    ? Number(versioned[1])
    : malformedVersioned
      ? Number(malformedVersioned[1])
      : 120000;
  const expectedHash = versioned
    ? versioned[2]
    : malformedVersioned
      ? malformedVersioned[2]
      : unversioned[1];

  if (!Number.isInteger(iterations) || iterations < 1 || iterations > 120000) {
    return json({ error: "Invalid email or password." }, 401);
  }

  let candidate;
  try {
    // Use Workers Web Crypto for verification so both current 100k hashes and
    // legacy 120k hashes can be verified consistently in production.
    candidate = await derivePasswordHashWebCrypto(password, salt, iterations);
  } catch {
    return json({ error: "Unable to verify this password. Please use Forgot Password to reset it." , code: "PASSWORD_RESET_REQUIRED" }, 409);
  }

  if (candidate !== expectedHash) {
    return json({ error: "Invalid email or password." }, 401);
  }

  // Upgrade every legacy/malformed hash after a successful login. A fresh salt
  // prevents carrying the old password-salt format forward.
  if (!versioned || Number(versioned[1]) !== PASSWORD_HASH_ITERATIONS) {
    const newSalt = new Uint8Array(16);
    crypto.getRandomValues(newSalt);
    const newHash = await derivePasswordHashWebCrypto(password, newSalt, PASSWORD_HASH_ITERATIONS);
    const normalizedHash = `pbkdf2-sha256$${PASSWORD_HASH_ITERATIONS}$${newHash}`;
    await env.DB.prepare(
      "UPDATE customer_accounts SET password_hash = ?, password_salt = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ?"
    ).bind(normalizedHash, bytesToBase64(newSalt), customer.id).run();
  }

  await env.DB.prepare(
    "UPDATE customer_accounts SET last_login_at = CURRENT_TIMESTAMP, updated_at = CURRENT_TIMESTAMP WHERE id = ?"
  ).bind(customer.id).run();

  const rawToken = await createSession(env, customer.id);
  const refreshed = await env.DB.prepare(
    "SELECT * FROM customer_accounts WHERE id = ? LIMIT 1"
  ).bind(customer.id).first();

  return json(
    { success: true, user: publicCustomer(refreshed) },
    200,
    { "set-cookie": sessionCookie(rawToken) }
  );
}'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js
          git diff --cached --quiet || git commit -m "chore: repair login authentication"
          git push
