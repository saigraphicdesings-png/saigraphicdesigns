name: Site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Product and catalog regression tests
        run: node --test scripts/test-product-import.mjs scripts/test-shop-catalog.mjs
      - name: Validate local links and duplicate IDs
        run: node scripts/validate-site.mjs
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4.129.1 deploy --dry-run --outdir /tmp/wrangler-dry-run
      - name: Test email accounts in Workers runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/account-runtime" --no-audit --no-fund miniflare@4
          node scripts/test-email-accounts.mjs
          node scripts/test-analytics.mjs
