name: Site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair password reset email sender
        if: ${{ github.event_name == 'push' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/worker.js';
          let s = fs.readFileSync(path, 'utf8');
          const oldFrom = 'const from = String(env.RESEND_FROM || "Sai Graphic Designs <onboarding@resend.dev>").trim();';
          const newFrom = `const from = String(env.RESEND_FROM || "").trim();
          if (!from) throw new Error("RESEND_FROM binding missing");`;
          if (s.includes(oldFrom)) s = s.replace(oldFrom, newFrom);
          const oldHeaders = `headers: {
              Authorization: \`Bearer \${env.RESEND_API_KEY}\`,
              "Content-Type": "application/json"
            },`;
          const newHeaders = `headers: {
              Authorization: \`Bearer \${env.RESEND_API_KEY}\`,
              "Content-Type": "application/json",
              ...(env.RESEND_REPLY_TO ? { "Reply-To": String(env.RESEND_REPLY_TO).trim() } : {})
            },`;
          if (s.includes(oldHeaders)) s = s.replace(oldHeaders, newHeaders);
          const oldFailure = `  if (!response.ok) {
              const detail = await response.text().catch(() => "");
              console.error("Resend password reset failed:", response.status, detail.slice(0, 500));
              throw new Error(\`Resend request failed with status \${response.status}\`);
            }`;
          const newFailure = `  if (!response.ok) {
              const detail = await response.text().catch(() => "");
              console.error("Resend password reset failed:", response.status, detail.slice(0, 1000));
              throw new Error(\`Resend request failed with status \${response.status}: \${detail.slice(0, 300)}\`);
            }`;
          if (s.includes(oldFailure)) s = s.replace(oldFailure, newFailure);
          fs.writeFileSync(path, s);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: repair password reset email"
            git push
          fi
      - name: Validate local links and duplicate IDs
        run: node scripts/validate-site.mjs
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4.129.1 deploy --dry-run --outdir /tmp/wrangler-dry-run
      - name: Test email accounts in Workers runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/account-runtime" --no-audit --no-fund miniflare@4
          node scripts/test-email-accounts.mjs