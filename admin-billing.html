<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Billing | Sai Graphic Designs</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-liquid-glass.css"><link rel="stylesheet" href="admin-billing.css"></head><body><header class="admin-header"></header><main class="billing-wrap"><section id="locked"><h1>Admin login required</h1><p>Login to the admin panel to open your billing book.</p><a href="admin.html">Open Admin Panel</a></section><section id="app" hidden><div class="billing-top"><div><p class="eyebrow">SAI GRAPHIC DESIGNS</p><h1>Billing Book</h1><p id="connection" role="status"></p></div><button data-action="invoice">+ New Invoice</button></div><p class="local-note">Offline book • Records are saved in this browser on this device. Export backups regularly. No GST.</p><div id="stats" class="billing-stats"></div><nav id="tabs" class="billing-tabs" aria-label="Billing sections"></nav><div id="toolbar" class="billing-toolbar"><input id="search" type="search" placeholder="Search customer, invoice or description…" aria-label="Search billing records"><select id="period" aria-label="Date filter"><option value="all">All time</option><option value="today">Today</option><option value="week">This week</option><option value="month">This month</option></select><button id="add"></button></div><div id="content"></div></section><p id="message" role="status"></p></main><dialog id="editor"><form id="editForm"><div class="dialog-top"><h2 id="editorTitle"></h2><button type="button" id="closeEditor" aria-label="Close">×</button></div><div id="fields"></div><p id="formError" role="alert"></p><div class="dialog-actions"><button type="submit" id="save">Save</button></div></form></dialog><section id="printArea"></section><script src="admin-sidebar.js" defer></script><script src="admin-billing.js" defer></script></body></html>
