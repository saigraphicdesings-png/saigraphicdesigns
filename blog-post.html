<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><link rel="stylesheet" href="style.css"><style>.post{max-width:820px;margin:0 auto;padding:76px 22px}.post small{color:#16845f;font-weight:800}.post h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.15}.post h2{margin-top:2.2rem}.post h3{margin-top:1.7rem}.post .excerpt,.post p,.post li{font-size:1.08rem;color:#304038;line-height:1.8}.answer{padding:18px 20px;border-left:4px solid #16845f;background:#f0f8f4;border-radius:8px}.post img{max-width:100%;border-radius:14px;margin:22px 0}.post blockquote{margin:22px 0;padding:4px 20px;border-left:4px solid #16845f;color:#52635b;font-size:1.1rem;line-height:1.7}.faq{padding:16px 0;border-bottom:1px solid #dbe7e0}.faq h3{margin:0 0 7px}</style></head><body><article class="post" id="post">Loading article…</article><script>(async()=>{const box=document.getElementById('post'),slug=new URLSearchParams(location.search).get('slug'),e=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const render=b=>{if(b.type==='heading')return '<h'+([2,3,4].includes(+b.level)?b.level:2)+'>'+e(b.text)+'</h'+([2,3,4].includes(+b.level)?b.level:2)+'>';if(b.type==='bullets'||b.type==='numbers')return '<'+(b.type==='numbers'?'ol':'ul')+'>'+((b.items||[]).map(x=>'<li>'+e(x)+'</li>').join(''))+'</'+(b.type==='numbers'?'ol':'ul')+'>';if(b.type==='image')return b.url?'<img src="'+e(b.url)+'" alt="'+e(b.alt)+'">':'';if(b.type==='quote')return '<blockquote>'+e(b.text)+'</blockquote>';if(b.type==='faq')return '<section class="faq"><h3>'+e(b.question)+'</h3><p>'+e(b.answer)+'</p></section>';return '<p>'+e(b.text)+'</p>'};try{const r=await fetch('/api/blog-posts/'+encodeURIComponent(slug),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error();const p=d.post;document.title=p.title+' | Sai Graphic Designs';document.querySelector('meta[name=description]')?.setAttribute('content',p.excerpt);const old=p.blocks?.length? p.blocks.map(render).join('') : '<p>'+e(p.content)+'</p>';box.innerHTML='<small>'+e(p.city)+'</small><h1>'+e(p.title)+'</h1><p class="excerpt">'+e(p.excerpt)+'</p>'+(p.directAnswer?'<section class="answer"><b>Quick answer</b><p>'+e(p.directAnswer)+'</p></section>':'')+old+(p.proof?'<p><small>By '+e(p.authorName)+' · '+e(p.proof)+'</small></p>':'');}catch(_){box.textContent='This article is unavailable.';}})();</script></body></html>
