name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify catalog rendering and site links
        run: |
          node --test scripts/test-billing-sync.mjs scripts/test-promotions.mjs scripts/test-catalog-html.mjs scripts/test-shop-catalog.mjs
          node scripts/validate-site.mjs

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: deploy --config wrangler.jsonc
      - name: Verify published shop and bundle sitemap
        run: python scripts/verify-deployment.py

