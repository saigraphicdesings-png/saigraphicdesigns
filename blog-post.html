<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><link rel="stylesheet" href="style.css"><style>.post{max-width:820px;margin:0 auto;padding:76px 22px}.post small{color:#16845f;font-weight:800}.post h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.15}.post .excerpt{font-size:1.15rem;color:#596862;line-height:1.7}.post .content{white-space:pre-wrap;color:#26362f;line-height:1.85}</style></head><body><article class="post" id="post">Loading article…</article><script>(async()=>{const box=document.getElementById('post'),slug=new URLSearchParams(location.search).get('slug');const e=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=await fetch('/api/blog-posts/'+encodeURIComponent(slug),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error();const p=d.post;document.title=p.title+' | Sai Graphic Designs';document.querySelector('meta[name=description]')?.setAttribute('content',p.excerpt);box.innerHTML='<small>'+e(p.city)+'</small><h1>'+e(p.title)+'</h1><p class="excerpt">'+e(p.excerpt)+'</p><div class="content">'+e(p.content)+'</div>';}catch(_){box.textContent='This article is unavailable.';}})();</script></body></html>
