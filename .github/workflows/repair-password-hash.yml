name: Repair password hash format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed password hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/worker.js')
          s = p.read_text()
          old = 'pbkdf2-sha256${PASSWORD_HASH_ITERATIONS}${await derivePasswordHash(password, salt)}'
          new = 'pbkdf2-sha256$${PASSWORD_HASH_ITERATIONS}$${await derivePasswordHash(password, salt)}'
          count = s.count(old)
          print(f'Found malformed writers: {count}')
          if count:
              s = s.replace(old, new)
              p.write_text(s)
          PY

      - name: Validate repaired worker syntax
        run: |
          node --check src/worker.js
          if grep -q 'pbkdf2-sha256${PASSWORD_HASH_ITERATIONS}${await derivePasswordHash(password, salt)}' src/worker.js; then
            echo 'Malformed password hash writer still present.'
            exit 1
          fi
          test "$(grep -c 'pbkdf2-sha256$${PASSWORD_HASH_ITERATIONS}$${await derivePasswordHash(password, salt)}' src/worker.js)" -eq 2

      - name: Commit repair
        run: |
          if git diff --quiet -- src/worker.js; then
            echo 'No worker changes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker.js
          git diff --cached --check
          git commit -m 'fix: correct password hash format in signup and reset'
          git push origin HEAD:main
