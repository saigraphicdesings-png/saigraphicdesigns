<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Task Management | Sai Graphic Designs</title><link rel="icon" href="Images/favicon.png"><link rel="stylesheet" href="admin.css"><style>
.task-shell{width:min(1200px,calc(100% - 286px));margin:0 24px 70px 262px;padding-top:28px}.task-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:20px}.task-top h1{margin:0}.task-top p{margin:4px 0 0;color:var(--muted)}.task-grid{display:grid;grid-template-columns:minmax(290px,.7fr) minmax(420px,1.3fr);gap:20px}.task-form,.task-list{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.task-form form{display:grid;gap:13px;margin-top:16px}.task-form textarea{min-height:92px;resize:vertical}.task-form button{margin-top:2px}.task-reminder{margin:0;padding:11px 13px;border-radius:12px;background:#eef7ff;color:#075891;font-weight:800;font-size:12px}.task-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.task-toolbar select{width:auto;min-width:150px}.task-cards{display:grid;gap:12px}.task-card{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--surface-alt)}.task-card h3{margin:0;font-size:16px}.task-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;color:var(--muted);font-size:12px;font-weight:750}.task-notes{margin:0;color:var(--text);white-space:pre-wrap}.task-actions{display:flex;align-items:flex-start;gap:7px;flex-wrap:wrap;justify-content:flex-end}.task-actions button{padding:7px 9px;font-size:12px}.complete{background:#dcfce7;color:#166534}.reopen{background:#e0f2fe;color:#075891}.remove{background:#ffe4e6;color:#be123c}.status{display:inline-flex;align-items:center;width:max-content;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:900}.status.open{background:#fef3c7;color:#92400e}.status.completed{background:#dcfce7;color:#166534}.status.cancelled{background:#e2e8f0;color:#475569}.empty{padding:45px 15px;text-align:center;color:var(--muted)}@media(max-width:900px){.task-shell{width:min(100% - 28px,900px);margin:0 auto 45px;padding-top:20px}.task-grid{grid-template-columns:1fr}.task-top{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.task-card{grid-template-columns:1fr}.task-actions{justify-content:flex-start}}
</style></head><body>
<header class="admin-header"></header>
<main class="task-shell"><div class="task-top"><div><p class="eyebrow">OFFLINE CUSTOMER WORK</p><h1>Task Management</h1><p>Track offline customer work. Telegram reminds you at 9:00 AM India time, one day before the end date.</p></div></div>
<div class="task-grid"><section class="task-form"><h2 id="formTitle">Add Task</h2><p class="task-reminder">🔔 One reminder only, sent one day before the selected end date.</p><form id="taskForm"><input id="taskId" type="hidden"><label>Customer name<input id="customerName" required maxlength="100" placeholder="Customer / business name"></label><label>Phone number (optional)<input id="customerPhone" maxlength="30" placeholder="+91 ..."></label><label>Task title<input id="taskTitle" required maxlength="160" placeholder="Example: 10 social media posters"></label><label>End date<input id="endDate" required type="date"></label><label>Notes (optional)<textarea id="taskNotes" maxlength="1000" placeholder="Work details, payment note, delivery requirement..."></textarea></label><button class="primary" type="submit" id="saveTask">Save Task</button><p class="form-message" id="taskMessage"></p></form></section>
<section class="task-list"><div class="task-toolbar"><h2>All Tasks</h2><select id="taskFilter"><option value="all">All tasks</option><option value="open">Open tasks</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div id="taskCards" class="task-cards"><p class="empty">Loading tasks…</p></div></section></div></main>
<script src="admin-sidebar.js" defer></script><script src="admin-tasks.js" defer></script></body></html>
