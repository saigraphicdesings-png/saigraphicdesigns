<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><link rel="stylesheet" href="style.css"><style>.post{max-width:820px;margin:auto;padding:76px 22px}.post small{color:#16845f;font-weight:800}.post h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.15}.post h2{margin-top:2.2rem}.post .excerpt,.post p,.post li{font-size:1.08rem;color:#304038;line-height:1.8}.featured,.post img{display:block;max-width:100%;width:100%;border-radius:14px;margin:22px 0}.answer{padding:18px 20px;border-left:4px solid #16845f;background:#f0f8f4;border-radius:8px}.post blockquote{margin:22px 0;padding:4px 20px;border-left:4px solid #16845f}.faq{padding:16px 0;border-bottom:1px solid #dbe7e0}.post table{width:100%;border-collapse:collapse;margin:22px 0}.post th,.post td{border:1px solid #dbe7e0;padding:11px;text-align:left}.post th{background:#edf6f1}</style></head><body><article class="post" id="post">Loading article…</article><script>(async()=>{const box=document.getElementById('post'),slug=new URLSearchParams(location.search).get('slug'),e=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),f=v=>e(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');const view=b=>{if(b.type==='heading')return '<h'+([2,3,4].includes(+b.level)?b.level:2)+'>'+f(b.text)+'</h'+([2,3,4].includes(+b.level)?b.level:2)+'>';if(b.type==='bullets'||b.type==='numbers')return '<'+(b.type==='numbers'?'ol':'ul')+'>'+(b.items||[]).map(x=>'<li>'+f(x)+'</li>').join('')+'</'+(b.type==='numbers'?'ol':'ul')+'>';if(b.type==='image')return b.url?'<img src="'+e(b.url)+'" alt="'+e(b.alt)+'">':'';if(b.type==='quote')return '<blockquote>'+f(b.text)+'</blockquote>';if(b.type==='faq')return '<section class="faq"><h3>'+f(b.question)+'</h3><p>'+f(b.answer)+'</p></section>';if(b.type==='table'){const rows=String(b.text||'').split('\n').filter(Boolean).map(r=>r.split('|').map(x=>x.trim()));return '<table>'+rows.map((r,i)=>'<tr>'+r.map(x=>(i?'td':'th')+'>'+f(x)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>'}return '<p>'+f(b.text)+'</p>'};try{const r=await fetch('/api/blog-posts/'+encodeURIComponent(slug),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error();const p=d.post,all=p.blocks||[],featured=all.find(b=>b.type==='image'&&b.url),body=all.filter(b=>b!==featured).map(view).join('')||'<p>'+f(p.content)+'</p>';document.title=p.title+' | Sai Graphic Designs';box.innerHTML='<small>'+e(p.city)+'</small><h1>'+f(p.title)+'</h1>'+(featured?'<img class="featured" src="'+e(featured.url)+'" alt="'+e(featured.alt)+'">':'')+'<p class="excerpt">'+f(p.excerpt)+'</p>'+(p.directAnswer?'<section class="answer"><b>Quick answer</b><p>'+f(p.directAnswer)+'</p></section>':'')+body+(p.proof?'<p><small>By '+e(p.authorName)+' · '+e(p.proof)+'</small></p>':'')}catch(_){box.textContent='This article is unavailable.'}})();</script></body></html>
