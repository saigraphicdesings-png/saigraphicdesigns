name: Inspect business card bundle title
on:
  push:
    branches: [fix/rename-business-card-bundle]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find exact public catalog record
        run: |
          curl --fail --silent --show-error --max-time 20 https://saigraphicdesigns.sai-graphic-designspagesdev.workers.dev/api/products -o /tmp/catalog.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/catalog.json'))
          matches=[{'id':p.get('id'),'name':p.get('name'),'price':p.get('price')} for p in data.get('products',[]) if '1001' in str(p.get('name',''))]
          print(json.dumps(matches,indent=2))
          PY
