name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify catalog rendering and site links
        run: |
          node --test scripts/test-catalog-html.mjs scripts/test-shop-catalog.mjs
          node scripts/validate-site.mjs

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: deploy --config wrangler.jsonc
      - name: Verify published shop and bundle sitemap
        run: |
          base="https://saigraphicdesigns.sai-graphic-designspagesdev.workers.dev"
          curl --fail --silent --show-error --location --max-redirs 5 --max-time 20 "$base/shop" -o /tmp/shop-live.html
          grep -q 'Bundle World' /tmp/shop-live.html
          grep -q 'id="allProducts"' /tmp/shop-live.html
          curl --fail --silent --show-error --location --max-time 20 -D /tmp/home-headers.txt "$base/" -o /tmp/home-live.html
          grep -qi 'x-catalog-rendered: 1' /tmp/home-headers.txt
          grep -q 'id="homeServicesGrid"' /tmp/home-live.html
          curl --fail --silent --show-error --location --max-redirs 5 --max-time 20 "$base/bundle-sitemap.xml" -o /tmp/bundle-sitemap.xml
          grep -q '<urlset' /tmp/bundle-sitemap.xml
          curl --fail --silent --show-error --location --max-redirs 5 --max-time 20 "$base/cdr-bundles" -o /tmp/cdr-bundles-live.html
          grep -q 'CorelDRAW (CDR) Design Bundles' /tmp/cdr-bundles-live.html
          curl --fail --silent --show-error --location --max-redirs 5 --max-time 20 "$base/free-cdr-files" -o /tmp/free-cdr-live.html
          grep -q 'Free CorelDRAW (CDR) Files' /tmp/free-cdr-live.html
