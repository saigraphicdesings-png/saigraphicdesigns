<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Blog Admin | Sai Graphic Designs</title><style>body{margin:0;background:#f4f7f5;color:#183128;font:15px Arial}.wrap{max-width:1040px;margin:auto;padding:32px 18px}input,textarea,button{font:inherit}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd8d2;border-radius:9px}textarea{min-height:130px}.card{background:#fff;border:1px solid #dbe7e0;border-radius:16px;padding:20px;margin:16px 0}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:9px;padding:12px 16px;background:#087f5b;color:#fff;font-weight:800;cursor:pointer}.delete{background:#b42318}.post{padding:14px 0;border-top:1px solid #e5ece8}.post:first-child{border:0}</style></head><body><main class="wrap"><h1>Blog Admin</h1><div class="card" id="login"><input id="token" type="password" placeholder="Admin token"><button class="btn" id="open">Open Blog Admin</button></div><section id="app" hidden><div class="card"><h2>Publish GEO / AEO Article</h2><form class="form" id="form"><input id="id" type="hidden"><input id="title" required placeholder="Article title"><div class="row"><input id="slug" placeholder="URL slug (optional)"><input id="city" value="Tamil Nadu" placeholder="Location / city"></div><textarea id="excerpt" required placeholder="Short answer / excerpt for search and AI"></textarea><textarea id="content" required placeholder="Full article content"></textarea><input id="keywords" placeholder="Keywords, separated by commas"><label><input id="published" type="checkbox" checked> Publish now</label><button class="btn">Save Article</button><p id="message"></p></form></div><div class="card"><h2>Published & Draft Articles</h2><div id="posts">Loading…</div></div></section></main><script src="admin-blog.js"></script></body></html>
