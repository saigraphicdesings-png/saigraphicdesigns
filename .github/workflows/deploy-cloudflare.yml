name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: deploy --config wrangler.jsonc
      - name: Verify published shop and bundle sitemap
        run: |
          base="https://saigraphicdesigns.sai-graphic-designspagesdev.workers.dev"
          curl --fail --silent --show-error --location --max-redirs 5 --max-time 20 "$base/shop" -o /tmp/shop-live.html
          grep -q 'Bundle World' /tmp/shop-live.html
          curl --fail --silent --show-error --location --max-redirs 5 --max-time 20 "$base/bundle-sitemap.xml" -o /tmp/bundle-sitemap.xml
          grep -q '<urlset' /tmp/bundle-sitemap.xml
