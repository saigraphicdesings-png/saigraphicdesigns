name: Deploy SAI Frames & Gifts
on:
  push:
    branches: [sai-frames-gifts]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 scripts/embed-assets.py
      - run: node --test scripts/test-frames.mjs scripts/test-auth.mjs scripts/test-courier.mjs scripts/test-registration.mjs
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.1'
          command: deploy --config wrangler.jsonc
