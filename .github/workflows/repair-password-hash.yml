name: Repair password hash format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed password hashes
        run: |
          if grep -q 'pbkdf2-sha256${PASSWORD_HASH_ITERATIONS}${await derivePasswordHash(password, salt)}' src/worker.js; then
            node scripts/repair-password-hash.mjs
          else
            echo 'No malformed password-hash writer found; nothing to repair.'
          fi

      - name: Validate repaired worker syntax
        run: node --check src/worker.js

      - name: Commit repair and remove one-off workflow
        run: |
          if git diff --quiet -- src/worker.js; then
            echo 'No worker changes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker.js scripts/repair-password-hash.mjs
          git diff --cached --check
          git commit -m 'fix: correct password hash format and migrate malformed hashes'
          git push origin HEAD:main
