name: Repair password reset email

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'chore: repair password reset email') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reset email delivery
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/worker.js';
          let s = fs.readFileSync(path, 'utf8');
          const oldFrom = 'const from = String(env.RESEND_FROM || "Sai Graphic Designs <onboarding@resend.dev>").trim();';
          const newFrom = `const from = String(env.RESEND_FROM || "").trim();
          if (!from) throw new Error("RESEND_FROM binding missing");`;
          if (!s.includes(oldFrom)) throw new Error('Expected RESEND_FROM fallback was not found');
          s = s.replace(oldFrom, newFrom);
          const oldHeaders = `headers: {
              Authorization: \`Bearer \${env.RESEND_API_KEY}\`,
              "Content-Type": "application/json"
            },`;
          const newHeaders = `headers: {
              Authorization: \`Bearer \${env.RESEND_API_KEY}\`,
              "Content-Type": "application/json",
              ...(env.RESEND_REPLY_TO ? { "Reply-To": String(env.RESEND_REPLY_TO).trim() } : {})
            },`;
          if (!s.includes(oldHeaders)) throw new Error('Expected Resend headers were not found');
          s = s.replace(oldHeaders, newHeaders);
          const oldFailure = `  if (!response.ok) {
              const detail = await response.text().catch(() => "");
              console.error("Resend password reset failed:", response.status, detail.slice(0, 500));
              throw new Error(\`Resend request failed with status \${response.status}\`);
            }`;
          const newFailure = `  if (!response.ok) {
              const detail = await response.text().catch(() => "");
              console.error("Resend password reset failed:", response.status, detail.slice(0, 1000));
              throw new Error(\`Resend request failed with status \${response.status}: \${detail.slice(0, 300)}\`);
            }`;
          if (!s.includes(oldFailure)) throw new Error('Expected Resend failure handler was not found');
          s = s.replace(oldFailure, newFailure);
          fs.writeFileSync(path, s);
          NODE
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: repair password reset email"
          git push